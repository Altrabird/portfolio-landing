<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Profile Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coral: '#FF6B6B',
            sunflower: '#FFD93D',
            mint: '#6BCB77',
            ocean: '#4D96FF',
            grape: '#9B59B6',
            blush: '#FF8BA7',
          },
          fontFamily: {
            display: ['"Poppins"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    .toast {
      animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  </style>
</head>
<body class="font-body bg-gray-950 text-white min-h-screen">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- Login Screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-6">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-coral to-grape flex items-center justify-center text-3xl">&#128274;</div>
        <h1 class="font-display font-bold text-2xl">Admin Panel</h1>
        <p class="text-gray-400 text-sm mt-2">Enter your password to manage content</p>
      </div>
      <div class="space-y-4">
        <input id="login-password" type="password" placeholder="Password"
          class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-ocean focus:outline-none text-white placeholder-gray-500">
        <button onclick="attemptLogin()" class="w-full py-3 rounded-xl bg-gradient-to-r from-ocean to-grape font-semibold hover:opacity-90 transition-opacity">
          Enter
        </button>
        <p id="login-error" class="text-coral text-sm text-center hidden">Incorrect password</p>
      </div>
      <div class="text-center mt-6">
        <a href="index.html" class="text-gray-500 text-sm hover:text-gray-300 transition-colors">&#8592; Back to site</a>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard (hidden until login) -->
  <div id="admin-dashboard" class="hidden">
    <!-- Header -->
    <header class="border-b border-gray-800 px-6 py-4">
      <div class="max-w-5xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-coral to-grape flex items-center justify-center text-sm">&#9881;</div>
          <h1 class="font-display font-bold text-lg">Content Manager</h1>
        </div>
        <div class="flex gap-3">
          <a href="index.html" target="_blank" class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors">
            &#128065; View Site
          </a>
          <button onclick="logout()" class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors text-coral">
            Logout
          </button>
        </div>
      </div>
    </header>

    <!-- Tab Navigation -->
    <div class="border-b border-gray-800 px-6">
      <div class="max-w-5xl mx-auto flex gap-1">
        <button onclick="switchTab('hero')" data-tab="hero" class="tab-btn px-5 py-3 text-sm font-medium border-b-2 border-ocean text-ocean transition-colors">Hero</button>
        <button onclick="switchTab('about')" data-tab="about" class="tab-btn px-5 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-white transition-colors">About</button>
        <button onclick="switchTab('skills')" data-tab="skills" class="tab-btn px-5 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-white transition-colors">Skills</button>
        <button onclick="switchTab('contact')" data-tab="contact" class="tab-btn px-5 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-white transition-colors">Contact</button>
      </div>
    </div>

    <!-- Content Panels -->
    <main class="max-w-5xl mx-auto px-6 py-8">

      <!-- HERO TAB -->
      <div id="tab-hero" class="tab-panel space-y-6">
        <h2 class="font-display font-bold text-xl mb-2">Hero Section</h2>

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm text-gray-400 mb-2">Full Name</label>
            <input id="edit-name" type="text" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-ocean focus:outline-none">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-2">Title / Role</label>
            <input id="edit-title" type="text" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-ocean focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">Tagline</label>
          <textarea id="edit-tagline" rows="2" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-ocean focus:outline-none resize-none"></textarea>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">Avatar Photo</label>
          <div class="flex items-center gap-4">
            <div id="avatar-preview" class="w-20 h-20 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center overflow-hidden text-2xl">&#128100;</div>
            <div>
              <input id="avatar-upload" type="file" accept="image/*" class="hidden" onchange="previewImage(this, 'avatar-preview')">
              <button onclick="document.getElementById('avatar-upload').click()" class="px-4 py-2 text-sm rounded-lg bg-gray-800 border border-gray-700 hover:border-ocean transition-colors">
                Upload Photo
              </button>
              <p class="text-gray-500 text-xs mt-1">JPG, PNG. Max 2MB.</p>
            </div>
          </div>
        </div>

        <button onclick="saveProfile()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-ocean to-grape font-semibold hover:opacity-90 transition-opacity">
          Save Hero
        </button>
      </div>

      <!-- ABOUT TAB -->
      <div id="tab-about" class="tab-panel hidden space-y-6">
        <h2 class="font-display font-bold text-xl mb-2">About Section</h2>

        <div>
          <label class="block text-sm text-gray-400 mb-2">Section Heading</label>
          <input id="edit-about-heading" type="text" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-ocean focus:outline-none">
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">Paragraph 1</label>
          <textarea id="edit-about-text1" rows="4" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-ocean focus:outline-none resize-none"></textarea>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">Paragraph 2</label>
          <textarea id="edit-about-text2" rows="4" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-ocean focus:outline-none resize-none"></textarea>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">About Photo</label>
          <div class="flex items-center gap-4">
            <div id="about-photo-preview" class="w-20 h-20 rounded-xl bg-gray-800 border border-gray-700 flex items-center justify-center overflow-hidden text-2xl">&#127891;</div>
            <div>
              <input id="about-photo-upload" type="file" accept="image/*" class="hidden" onchange="previewImage(this, 'about-photo-preview')">
              <button onclick="document.getElementById('about-photo-upload').click()" class="px-4 py-2 text-sm rounded-lg bg-gray-800 border border-gray-700 hover:border-ocean transition-colors">
                Upload Photo
              </button>
              <p class="text-gray-500 text-xs mt-1">JPG, PNG. Max 2MB.</p>
            </div>
          </div>
        </div>

        <button onclick="saveProfile()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-ocean to-grape font-semibold hover:opacity-90 transition-opacity">
          Save About
        </button>
      </div>

      <!-- SKILLS TAB -->
      <div id="tab-skills" class="tab-panel hidden space-y-6">
        <div class="flex items-center justify-between">
          <h2 class="font-display font-bold text-xl">Skills</h2>
          <button onclick="addSkill()" class="px-4 py-2 text-sm rounded-lg bg-ocean/20 text-ocean hover:bg-ocean/30 transition-colors">
            + Add Skill
          </button>
        </div>

        <div id="skills-list" class="space-y-4">
          <!-- Skills populated by JS -->
        </div>
      </div>

      <!-- CONTACT TAB -->
      <div id="tab-contact" class="tab-panel hidden space-y-6">
        <h2 class="font-display font-bold text-xl mb-2">Contact Links</h2>

        <div>
          <label class="block text-sm text-gray-400 mb-2">Email Address</label>
          <input id="edit-email" type="email" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-ocean focus:outline-none" placeholder="your@email.com">
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">LinkedIn URL</label>
          <input id="edit-linkedin" type="url" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-ocean focus:outline-none" placeholder="https://linkedin.com/in/yourname">
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">GitHub URL</label>
          <input id="edit-github" type="url" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-ocean focus:outline-none" placeholder="https://github.com/yourname">
        </div>

        <button onclick="saveProfile()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-ocean to-grape font-semibold hover:opacity-90 transition-opacity">
          Save Contact
        </button>
      </div>

    </main>
  </div>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Scripts -->
  <script src="js/supabase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
